# nginx snippet — add to your live.xsen.fun:8443 server block
# This proxies /whip/* to MediaMTX's WebRTC WHIP endpoint on port 8889
#
# Glasses use: https://live.xsen.fun:8443/whip/{streamKey}
# MediaMTX receives: http://localhost:8889/whip/{streamKey}

# WHIP ingest from glasses
location /whip/ {
    proxy_pass http://127.0.0.1:8889/whip/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebRTC WHIP uses POST + PATCH — allow both
    proxy_request_buffering off;
    proxy_buffering off;

    # Large body for SDP exchange
    client_max_body_size 10m;
}

# HLS viewer output (if not already proxied)
location /hls/ {
    proxy_pass http://127.0.0.1:8888/hls/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # CORS for web players
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    add_header Cache-Control "no-cache";
}

# MediaMTX WebRTC viewer (optional — for browser-based WebRTC viewing)
location /webrtc/ {
    proxy_pass http://127.0.0.1:8889/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
}
